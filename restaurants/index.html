<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Restaurants · Noah & Helen</title>
<meta name="description" content="Unsere Restaurant-Liste für Braunschweig: ausprobieren, bewerten, Favoriten.">
<meta name="theme-color" content="#f4ece6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#120f14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Restaurants">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
:root {
  --sab: env(safe-area-inset-bottom);
  --text: #1c1917; --muted: #6b625c; --faint: #a39a93;
  --glass: rgba(255, 255, 255, .52); --glass-strong: rgba(255, 255, 255, .72);
  --glass-line: rgba(255, 255, 255, .75); --glass-edge: rgba(0, 0, 0, .06);
  --shadow: 0 10px 40px rgba(60, 30, 10, .14), 0 2px 8px rgba(60, 30, 10, .06);
  --accent: #ff5a36; --accent2: #ff2d55; --gold: #ffb800; --ok: #1f9d55; --warn: #d97706; --bad: #dc2626;
  --noah: #0a84ff; --helen: #ff375f;
  --blob1: #ffb38a; --blob2: #ff7aa2; --blob3: #ffd27a; --blob4: #9ad0ff; --bg: #f4ece6;
  --r: 24px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #f5f2ef; --muted: #b3aaa3; --faint: #776f69;
    --glass: rgba(40, 34, 40, .48); --glass-strong: rgba(48, 42, 50, .72);
    --glass-line: rgba(255, 255, 255, .14); --glass-edge: rgba(255, 255, 255, .06);
    --shadow: 0 10px 40px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
    --blob1: #7a2e14; --blob2: #6b1d43; --blob3: #6b4a0a; --blob4: #123b66; --bg: #120f14;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); overflow-x: hidden;
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: inherit; }

/* ---------- lebendiger Hintergrund ---------- */
.bg { position: fixed; inset: -20vmax; z-index: -1; filter: blur(60px) saturate(140%); opacity: .9; pointer-events: none; }
.bg i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; mix-blend-mode: normal; }
.bg i:nth-child(1) { background: radial-gradient(circle, var(--blob1) 0, transparent 65%); left: 0; top: 0; animation: drift1 26s ease-in-out infinite alternate; }
.bg i:nth-child(2) { background: radial-gradient(circle, var(--blob2) 0, transparent 65%); right: 0; top: 10vmax; animation: drift2 32s ease-in-out infinite alternate; }
.bg i:nth-child(3) { background: radial-gradient(circle, var(--blob3) 0, transparent 65%); left: 15vmax; bottom: 0; animation: drift3 29s ease-in-out infinite alternate; }
.bg i:nth-child(4) { background: radial-gradient(circle, var(--blob4) 0, transparent 60%); right: 5vmax; bottom: 10vmax; opacity: .7; animation: drift1 35s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-16vmax, 18vmax) scale(.9); } }
@keyframes drift3 { to { transform: translate(12vmax, -16vmax) scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .bg i { animation: none !important; } }

/* ---------- Liquid Glass ---------- */
.glass {
  position: relative; background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(185%); backdrop-filter: blur(28px) saturate(185%);
  border: 1px solid var(--glass-line); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 var(--glass-edge);
}
.glass::before { /* spiegelnde Kante */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,.18) 100%);
  mix-blend-mode: soft-light;
}
@media (prefers-color-scheme: dark) { .glass { box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.12); } }

.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px calc(120px + env(safe-area-inset-bottom)); }

/* ---------- Kopf ---------- */
header { padding: calc(18px + env(safe-area-inset-top)) 0 6px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
h1 { margin: 2px 0 0; font-size: 34px; line-height: 1.05; letter-spacing: -.03em; font-weight: 800; }
h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hbtns { display: flex; gap: 8px; padding-bottom: 2px; }
.cbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; font-size: 20px; }
.cbtn[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.cbtn:active, .pbtn:active, .card:active { transform: scale(.97); }
.cbtn, .pbtn, .card, .chip, .tab { transition: transform .18s cubic-bezier(.3,.7,.4,1.4), background .2s, box-shadow .2s; }

/* ---------- Statistik ---------- */
.stats { margin-top: 14px; border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
.stats b { display: block; font-size: 22px; letter-spacing: -.02em; line-height: 1.1; }
.stats span { font-size: 11px; color: var(--muted); font-weight: 600; }
.stats .n b { color: var(--noah); } .stats .h b { color: var(--helen); }
.stats .duel { grid-column: 1 / -1; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--glass-line); font-size: 13px; color: var(--muted); text-align: left; }
.stats .duel:empty { display: none; }
.stats .duel b { display: inline; font-size: inherit; color: var(--text); letter-spacing: 0; }

/* ---------- Suche & Filter ---------- */
.controls { position: sticky; top: -1px; z-index: 10; margin: 4px -16px 0; padding: 8px 16px 8px; transition: padding .2s; }
.controls.stuck { padding-top: calc(8px + env(safe-area-inset-top)); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); background: color-mix(in srgb, var(--bg) 55%, transparent); }
.search { display: flex; align-items: center; gap: 8px; border-radius: 16px; padding: 0 12px; height: 44px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 16px; color: var(--text); }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; margin: 4px -16px -8px; padding: 8px 16px 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: 0 3px 10px rgba(60,30,10,.08), inset 0 1px 0 rgba(255,255,255,.55); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.chip[aria-pressed="true"]::before { display: none; }
.sortrow { display: flex; justify-content: space-between; align-items: center; margin: 12px 2px 8px; gap: 10px; }
.count { font-size: 13px; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 5px 10px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }

/* ---------- Karten ---------- */
.list { display: grid; gap: 14px; }
@media (min-width: 600px) { .list { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; } }
.card { border-radius: var(--r); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
.cover { position: relative; height: 150px; background: var(--c, #888); overflow: hidden; }
.cover .art { position: absolute; inset: 0; background:
  radial-gradient(120% 90% at 85% 10%, rgba(255,255,255,.35), transparent 55%),
  radial-gradient(90% 80% at 0% 100%, rgba(0,0,0,.35), transparent 60%),
  linear-gradient(135deg, color-mix(in srgb, var(--c) 80%, #fff 20%), color-mix(in srgb, var(--c) 70%, #000 30%)); }
.cover .emo { position: absolute; right: 14px; bottom: -14px; font-size: 96px; line-height: 1; filter: drop-shadow(0 10px 20px rgba(0,0,0,.3)); transform: rotate(-8deg); }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s; }
.cover img.on { opacity: 1; }
.cover .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.0) 40%, rgba(0,0,0,.45)); }
.badges { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.bdg { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; color: #fff;
  background: rgba(0,0,0,.28); -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); border: 1px solid rgba(255,255,255,.28); }
.bdg.fav { background: rgba(255, 184, 0, .85); color: #3a2a00; }
.bdg.open { background: rgba(31, 157, 85, .85); } .bdg.soon { background: rgba(217, 119, 6, .9); } .bdg.closed { background: rgba(0,0,0,.4); }
.bdg.rank { background: linear-gradient(135deg, #ffd34d, #ff9f0a); color: #3a2400; }
.scorepill { position: absolute; right: 10px; bottom: 10px; font-weight: 800; font-size: 15px; padding: 5px 10px; border-radius: 14px; color: #fff;
  background: rgba(0,0,0,.3); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.3); }
.body { padding: 12px 14px 14px; }
.name { font-size: 19px; font-weight: 750; letter-spacing: -.02em; line-height: 1.2; }
.sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.rates { display: flex; gap: 8px; margin-top: 10px; }
.rate { flex: 1; border-radius: 14px; padding: 7px 10px; background: color-mix(in srgb, var(--who) 12%, transparent); }
.rate small { display: block; font-size: 11px; font-weight: 700; color: var(--who); }
.stars { font-size: 14px; letter-spacing: 1px; color: var(--gold); white-space: nowrap; }
.stars .off { color: color-mix(in srgb, var(--faint) 50%, transparent); }
.rate .none { font-size: 12px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); font-weight: 600; row-gap: 2px; }
.meta span { white-space: nowrap; } .meta span + span::before { content: "·"; margin: 0 6px; }
.empty { text-align: center; padding: 40px 20px; border-radius: var(--r); color: var(--muted); }
.empty b { display: block; font-size: 40px; margin-bottom: 6px; }

/* ---------- Karte (Map) ---------- */
#mapwrap { border-radius: var(--r); overflow: hidden; height: calc(100dvh - 400px - env(safe-area-inset-bottom)); min-height: 340px; }
#map { width: 100%; height: 100%; }
.pin { width: 44px; height: 44px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); display: grid; place-items: center;
  background: var(--c); border: 3px solid #fff; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.pin span { transform: rotate(45deg); font-size: 22px; }
.leaflet-container { font: inherit; background: transparent; }
.darktiles { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6); }
.leaflet-control-attribution { font-size: 10px; }

/* ---------- Tab-Leiste ---------- */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 20;
  display: flex; gap: 2px; padding: 5px; border-radius: 30px; width: min(440px, calc(100vw - 24px)); }
.tab { flex: 1; border: 0; background: none; border-radius: 24px; padding: 6px 4px 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--muted); }
.tab b { font-size: 21px; line-height: 1.1; filter: grayscale(.6); opacity: .8; }
.tab span { font-size: 11px; font-weight: 650; }
.tab[aria-selected="true"] { background: var(--glass-strong); color: var(--text); box-shadow: 0 2px 10px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.6); }
.tab[aria-selected="true"] b { filter: none; opacity: 1; }

/* ---------- Bottom Sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 6, 4, .35); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; margin: 0 auto; max-width: 720px; max-height: calc(100vh - env(safe-area-inset-top) - 24px);
  border-radius: 30px 30px 0 0; transform: translateY(105%); transition: transform .42s cubic-bezier(.2, .9, .25, 1); display: flex; flex-direction: column;
  background: var(--glass-strong); }
.sheet { visibility: hidden; transform: translateY(calc(100% + 60px)); transition: transform .42s cubic-bezier(.2, .9, .25, 1), visibility 0s .42s; }
.sheet.on { visibility: visible; transform: translateY(0); transition: transform .42s cubic-bezier(.2, .9, .25, 1); }
.sheet .grab { padding: 8px 0 4px; display: grid; place-items: center; cursor: grab; flex: none; touch-action: none; }
.sheet .grab i { width: 40px; height: 5px; border-radius: 3px; background: var(--faint); }
.sheet .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
.sx { position: absolute; right: 14px; top: 12px; z-index: 3; width: 34px; height: 34px; border-radius: 50%; border: 0; font-size: 16px; cursor: pointer; display: grid; place-items: center; }

.hero { position: relative; border-radius: 22px; overflow: hidden; height: 210px; background: var(--c); margin-top: 4px; }
.hero .art, .hero .emo { position: absolute; }
.hero .art { inset: 0; background:
  radial-gradient(120% 90% at 85% 10%, rgba(255,255,255,.35), transparent 55%),
  linear-gradient(135deg, color-mix(in srgb, var(--c) 80%, #fff 20%), color-mix(in srgb, var(--c) 70%, #000 30%)); }
.hero .emo { right: 18px; bottom: -20px; font-size: 130px; transform: rotate(-8deg); filter: drop-shadow(0 12px 24px rgba(0,0,0,.3)); }
.gallery { position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.gallery::-webkit-scrollbar { display: none; }
.gallery figure { margin: 0; flex: 0 0 100%; height: 100%; scroll-snap-align: center; position: relative; }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery figcaption { position: absolute; left: 8px; bottom: 8px; font-size: 10px; color: #fff; background: rgba(0,0,0,.4); padding: 2px 6px; border-radius: 6px; max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gallery figcaption a { text-decoration: none; }
.gcount { position: absolute; right: 10px; bottom: 10px; }
.s-title { margin: 14px 2px 2px; font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.s-sub { margin: 4px 2px 0; color: var(--muted); font-size: 14px; }
.s-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.s-chips span { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--text) 7%, transparent); }
.s-chips .warn { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }

.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.pbtn { border: 0; border-radius: 18px; padding: 10px 4px 9px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 650; text-align: center; }
.pbtn b { font-size: 22px; line-height: 1; }
.pbtn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: 0; }
.pbtn.primary::before { display: none; }
.pbtn.dis { opacity: .4; pointer-events: none; }

.sec { margin-top: 14px; border-radius: 20px; padding: 14px; }
.sec h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.sec h3 a { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 700; }
.big-rates { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
.big-rates div { border-radius: 16px; padding: 10px 4px; background: color-mix(in srgb, var(--who, var(--gold)) 12%, transparent); }
.big-rates b { display: block; font-size: 26px; letter-spacing: -.02em; color: var(--who, var(--text)); }
.big-rates small { font-size: 12px; font-weight: 700; color: var(--muted); }
.big-rates .stars { font-size: 12px; }
.note { margin-top: 10px; font-size: 14px; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--gold) 14%, transparent); }
.rate-cta { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; padding: 11px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 14px;
  background: var(--text); color: var(--bg); }
.hl { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.hl li { display: flex; gap: 10px; font-size: 15px; line-height: 1.35; }
.hl li::before { content: "✦"; color: var(--accent); flex: none; }
.loc { padding: 10px 0; border-top: 1px solid var(--glass-line); }
.loc:first-of-type { border-top: 0; padding-top: 0; }
.loc .l1 { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.loc .l2 { font-size: 14px; color: var(--muted); margin-top: 2px; }
.loc .dist { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.hours { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
.hours td { padding: 4px 0; } .hours td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.hours tr.today td { font-weight: 800; }
.hours tr.today td:first-child::after { content: " · heute"; color: var(--accent); font-weight: 700; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.mapframe { width: 100%; height: 200px; border: 0; border-radius: 14px; margin-top: 10px; background: color-mix(in srgb, var(--text) 6%, transparent); }
.links { display: grid; gap: 8px; }
.links a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; text-decoration: none; font-weight: 650; font-size: 15px;
  background: color-mix(in srgb, var(--text) 5%, transparent); }
.links a span { flex: 1; } .links a i { font-style: normal; color: var(--faint); }
.links a b { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; background: var(--glass-strong); }
.review { padding: 10px 0; border-top: 1px solid var(--glass-line); font-size: 14px; }
.review:first-of-type { border-top: 0; padding-top: 0; }
.review .who { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
.review .who img { width: 24px; height: 24px; border-radius: 50%; }
.review .who small { color: var(--muted); font-weight: 600; }
.review p { margin: 6px 0 0; color: color-mix(in srgb, var(--text) 85%, transparent); }
.gattr { font-size: 11px; color: var(--muted); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.extern { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.extern b { font-size: 22px; }

/* ---------- Zufall ---------- */
.dice { text-align: center; padding: 6px 4px 4px; }
.dice h2 { margin: 6px 0 4px; font-size: 24px; letter-spacing: -.02em; }
.dice p { margin: 0; color: var(--muted); font-size: 14px; }
.slot { margin: 18px auto 14px; height: 120px; border-radius: 24px; display: grid; place-items: center; overflow: hidden; position: relative; }
.slot .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; padding: 0 16px; }
.slot .v small { display: block; font-size: 14px; color: var(--muted); font-weight: 600; margin-top: 2px; }
.slot .v.spin { animation: blur .09s linear infinite; }
@keyframes blur { 0% { transform: translateY(-6px); filter: blur(2px); } 100% { transform: translateY(6px); filter: blur(2px); } }
.slot .v.land { animation: land .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes land { from { transform: scale(.7); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.dice .seg { margin-top: 12px; }
.go { width: 100%; border: 0; border-radius: 18px; padding: 15px; font-size: 17px; font-weight: 800; color: #fff; cursor: pointer; margin-top: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 40%, transparent); }
.go.sec2 { background: var(--text); color: var(--bg); box-shadow: none; margin-top: 8px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 10px 14px; border-radius: 16px; font-weight: 650; font-size: 15px; cursor: pointer; }

        </label>
        <div class="chips" id="chips"></div>
      </div>
      <div class="sortrow" id="sortrow">
        <div class="count" id="count"></div>
        <div class="seg glass" id="sortseg" role="group" aria-label="Sortieren">
          <button data-sort="score">Ø</button><button data-sort="dist">Nähe</button><button data-sort="name">A–Z</button>
        </div>
      </div>

      <div class="mapctl" id="mapctl">
        <button data-mz="in" aria-label="Hineinzoomen">＋</button><button data-mz="out" aria-label="Herauszoomen">－</button>
        <button data-mz="all" aria-label="Alle zeigen" title="Alle zeigen">⤢</button><button data-mz="me" aria-label="Mein Standort" title="Mein Standort">◎</button>

</div>

<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-label="Details">
  <div class="grab" id="grab"><i></i></div>

  <div class="scroll" id="sheetbody"></div>
</div>
<div class="toast glass" id="toast"></div>

<script type="module">
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WT = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const WK = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const KUECHE_EMO = { Italienisch: "🍕", Türkisch: "🧆", Griechisch: "🫒", Argentinisch: "🥩", Deutsch: "🍺", Asiatisch: "🥢", Japanisch: "🍣", Vietnamesisch: "🍜", Indisch: "🍛", Mexikanisch: "🌮", Burger: "🍔", Spanisch: "🥘", Libanesisch: "🧆", Chinesisch: "🥡", Thai: "🍲", Koreanisch: "🍱", Französisch: "🥐", Amerikanisch: "🍔", Café: "☕" };
const FARBEN = ["#ff6b35", "#7b61ff", "#00a389", "#e0457b", "#2f80ed", "#c27c0e"];
const PERS = [{ k: "noah", n: "Noah", c: "var(--noah)" }, { k: "helen", n: "Helen", c: "var(--helen)" }];
const FBV = "10.12.2";
const MQ = { wide: matchMedia("(min-width: 768px)"), desk: matchMedia("(min-width: 1024px)") };

let D = { restaurants: [] }, CFG = {}, G = {};
let FB = null;                                         // Firebase-Handles, sobald konfiguriert
const ME = { user: null, who: null, ready: false };   // angemeldete Person
let LIVE = false;                                     // Daten kommen live aus Firestore
const st = { tab: "ranking", q: "", chips: new Set(), sort: "score", pos: null, open: null, pushed: false };
try { const s = JSON.parse(localStorage.getItem("rs-state") || "{}"); st.tab = s.tab || st.tab; st.sort = s.sort || st.sort; st.chips = new Set(JSON.parse(localStorage.getItem("rs-chips") || "[]")); } catch (e) {}
st.mapOpen = (() => { try { return localStorage.getItem("rs-map") === "1"; } catch (e) { return false; } })();
const save = () => { try { localStorage.setItem("rs-state", JSON.stringify({ tab: st.tab, sort: st.sort })); localStorage.setItem("rs-chips", JSON.stringify([...st.chips])); } catch (e) {} };

/* ---------- Hilfen ---------- */
const det = r => r.details || {};
const color = r => det(r).farbe || FARBEN[[...r.id].reduce((a, c) => a + c.charCodeAt(0), 0) % FARBEN.length];
const emoji = r => det(r).emoji || KUECHE_EMO[r.kueche] || "🍽️";
const avg = r => { const v = [r.noah, r.helen].filter(Boolean); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const fmt1 = n => n == null ? "–" : n.toFixed(1).replace(".", ",");
const starHtml = n => `<span class="stars">${"★".repeat(n || 0)}<span class="off">${"★".repeat(5 - (n || 0))}</span></span>`;
const locs = r => det(r).standorte || [];
const byId = id => D.restaurants.find(x => x.id === id) || DISC.items.find(x => x.id === id);
const nname = s => (s || "").toLowerCase().replace(/[^a-z0-9äöüß]/g, "");
const inList = r => { const a = nname(r.name); return D.restaurants.some(x => { const b = nname(x.name); return a === b || (Math.min(a.length, b.length) >= 5 && (a.includes(b) || b.includes(a))); }); };
const canEdit = () => !!(FB && ME.user && ME.ready);
const toast = t => { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2400); };
const clean = o => JSON.parse(JSON.stringify(o));     // Firestore mag kein undefined
const datum = iso => new Date(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" });

function berlinNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Berlin", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return { day: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday), min: (+p.hour) * 60 + (+p.minute) };
}
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const slot = s => typeof s === "string" ? s.split("-") : s;   // "12:00-22:00" oder ["12:00","22:00"]
function zeitenOf(r, l) { return (G[r.id] && G[r.id].zeiten) || l.zeiten || null; }

function statusOf(r) {
  const n = berlinNow(), now = n.day * 1440 + n.min; let next = null, known = false;
  for (const l of locs(r)) {
    const z = zeitenOf(r, l); if (!z) continue; known = true;
    for (let d = 0; d < 7; d++) for (const sl of z[d] || []) {
      const [a, b] = slot(sl); const s = toMin(a), e0 = toMin(b), e = e0 <= s ? e0 + 1440 : e0;
      for (const w of [-7, 0, 7]) {
        const S = (d + w) * 1440 + s, E = (d + w) * 1440 + e;
        if (now >= S && now < E) { const left = E - now; return { k: left <= 45 ? "soon" : "open", t: left <= 45 ? `Schließt um ${b}` : `Geöffnet bis ${b}` }; }
        if (S > now && (!next || S < next.S)) next = { S, a, d };
      }
    }
  }
  if (!known) return null;
  if (!next) return { k: "closed", t: "Geschlossen" };
  const tage = Math.floor(next.S / 1440) - n.day;
  return { k: "closed", t: tage === 0 ? `Öffnet ${next.a}` : tage === 1 ? `Morgen ab ${next.a}` : `${WK[next.d]} ab ${next.a}` };
}
const isOpen = r => { const s = statusOf(r); return s && (s.k === "open" || s.k === "soon"); };

function km(a, b) {
  const R = 6371, dLa = (b.lat - a.lat) * Math.PI / 180, dLo = (b.lng - a.lng) * Math.PI / 180;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function distOf(r) { if (!st.pos) return null; const d = locs(r).filter(l => l.lat).map(l => km(st.pos, l)); return d.length ? Math.min(...d) : null; }
const distTxt = d => d == null ? "" : (d < 1 ? `${Math.round(d * 1000)} m` : `${d.toFixed(1).replace(".", ",")} km`);
const wegTxt = d => { if (d == null) return ""; const f = Math.round(d / 4.8 * 60), r = Math.round(d / 15 * 60); return d < 2.5 ? `${f} min zu Fuß` : `${Math.max(r, 1)} min Rad`; };
function routeUrl(l) { const q = encodeURIComponent(l.adresse); return IOS ? `https://maps.apple.com/?daddr=${q}&dirflg=d` : `https://www.google.com/maps/dir/?api=1&destination=${q}`; }
const gmapsUrl = r => (G[r.id] && G[r.id].url) || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(det(r).google_query || r.name + " " + (locs(r)[0]?.adresse || "Braunschweig"))}`;

/* ---------- Filter & Sortierung ---------- */
const CHIPS = [
  { k: "offen", l: "🟢 Jetzt offen", f: r => isOpen(r) },
  { k: "vegan", l: "🌱 Vegan", f: r => (det(r).tags || []).some(t => /vegan/i.test(t)) },
  { k: "liefer", l: "🛵 Lieferung", f: r => !!(det(r).links || {}).bestellen || (det(r).tags || []).some(t => /liefer/i.test(t)) },
  { k: "protein", l: "💪 Protein", f: r => /steak|argent|grill/i.test(`${r.kueche} ${det(r).kueche_detail} ${(det(r).tags || []).join(" ")}`) },
  { k: "nie", l: "✨ Noch nie dort", f: r => !(r.besuche || []).length && avg(r) == null },
];
const kuechen = () => [...new Set(D.restaurants.map(r => r.kueche).filter(Boolean))].sort();

function filtered(tab = st.tab) {
  const q = st.q.trim().toLowerCase();
  return D.restaurants.filter(r => {
    if (tab === "neu" && r.liste === "Favorit") return false;
    if (tab === "fav" && r.liste !== "Favorit") return false;
    for (const c of st.chips) { const def = CHIPS.find(x => x.k === c); if (def ? !def.f(r) : r.kueche !== c.slice(2)) return false; }
    if (q) {
      const d = det(r), hay = [r.name, r.kueche, r.notiz, d.voller_name, d.kueche_detail, d.untertitel, ...(d.highlights || []), ...(d.tags || []), ...locs(r).map(l => l.adresse + " " + (l.stadtteil || ""))].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
const extOf = r => G[r.id]?.rating ?? det(r).extern?.wert ?? 0;
function sorted(list) {
  const s = st.tab === "ranking" ? "score" : st.sort;
  const by = {
    score: (a, b) => (avg(b) ?? -1) - (avg(a) ?? -1) || extOf(b) - extOf(a) || a.name.localeCompare(b.name, "de"),
    dist: (a, b) => (distOf(a) ?? 1e9) - (distOf(b) ?? 1e9),
    name: (a, b) => a.name.localeCompare(b.name, "de"),
  };
  return list.slice().sort(by[s] || by.score);
}

/* ---------- Übersicht ---------- */
function renderStats() {
  if (!$("stats")) return;
  const R = D.restaurants, rated = R.filter(r => avg(r) != null);
  const mean = k => { const v = R.map(r => r[k]).filter(Boolean); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const both = R.filter(r => r.noah && r.helen);
  const besuche = R.reduce((a, r) => a + (r.besuche || []).length, 0);
  let duel;
  if (both.length) {
    const einig = both.filter(r => Math.abs(r.noah - r.helen) <= 1).length;
    const streit = both.slice().sort((a, b) => Math.abs(b.noah - b.helen) - Math.abs(a.noah - a.helen))[0];
    duel = `🤝 Bei ${einig} von ${both.length} seid ihr euch einig (±1★)` + (Math.abs(streit.noah - streit.helen) >= 2 ? ` · größter Streitfall: <b>${esc(streit.name)}</b>` : "");
  } else duel = canEdit() ? `✨ Restaurant antippen und Sterne vergeben – hier erscheint dann euer Ranking.` : `✨ Zum Bewerten oben rechts anmelden.`;
  if (besuche) duel += ` · 🍽️ ${besuche} Besuche eingetragen`;
  $("stats").innerHTML = `
    <div><b>${R.length}</b><span>Restaurants</span></div>
    <div><b>${rated.length}</b><span>bewertet</span></div>
    <div class="n"><b>${fmt1(mean("noah"))}</b><span>Ø Noah</span></div>
    <div class="h"><b>${fmt1(mean("helen"))}</b><span>Ø Helen</span></div>
    <div class="duel">${duel}</div>`;
}
function renderChips() {
  if (st.tab === "entdecken") {
    $("chips").innerHTML = DISC_CATS.map(([k, l]) => `<button class="chip glass" data-dcat="${k}" aria-pressed="${DISC.cat === k}">${l}</button>`).join("");
    return;
  }
  const k = kuechen().map(x => ({ k: "k:" + x, l: `${KUECHE_EMO[x] || "🍽️"} ${x}` }));
  $("chips").innerHTML = [...CHIPS, ...k].map(c => `<button class="chip glass" data-chip="${esc(c.k)}" aria-pressed="${st.chips.has(c.k)}">${esc(c.l)}</button>`).join("");
}

function card(r, rank) {
  const s = statusOf(r), a = avg(r), d = distOf(r), dd = det(r), g = G[r.id];
  const photo = g && g.photos && g.photos[0];
  const bad = g && g.status && g.status !== "OPERATIONAL";
  const badges = [];
  if (rank && (a != null || r._disc)) badges.push(`<span class="bdg rank">#${rank}</span>`);
  if (r.liste === "Favorit") badges.push(`<span class="bdg fav">❤️ Favorit</span>`);
  if (bad) badges.push(`<span class="bdg closed">⚠️ ${g.status === "CLOSED_PERMANENTLY" ? "Dauerhaft geschlossen" : "Vorübergehend zu"}</span>`);
  else if (s) badges.push(`<span class="bdg ${s.k}">${esc(s.t)}</span>`);
  const ext = g?.rating ?? dd.extern?.wert;
  const rate = p => `<div class="rate" style="--who:${p.c}"><small>${p.n}</small>${r[p.k] ? starHtml(r[p.k]) : `<span class="none">noch offen</span>`}</div>`;
  const nb = (r.besuche || []).length;
  const meta = [dd.kueche_detail || r.kueche, dd.preis, locs(r).length > 1 ? `${locs(r).length} Standorte` : (locs(r)[0]?.stadtteil), nb ? `${nb}× besucht` : ""].filter(Boolean).map(esc);
  if (d != null) meta.push(`📍 ${distTxt(d)}`);
  return `<article class="card glass" data-id="${esc(r.id)}" tabindex="0" role="button" aria-label="${esc(r.name)} öffnen" style="--c:${color(r)}">
    <div class="cover"><div class="art"></div><div class="emo">${emoji(r)}</div>
      ${photo ? `<img alt="" loading="lazy" decoding="async" src="${esc(photo.url)}" onload="this.classList.add('on')">` : ""}
      <div class="shade"></div>
      <div class="badges">${badges.join("")}</div>
      ${a != null ? `<div class="scorepill">Ø ${fmt1(a)} ★</div>` : ext && !r._disc ? `<div class="scorepill" title="externe Bewertung">${fmt1(ext)} ★ ext.</div>` : ""}
    </div>
    <div class="body">
      <div class="name">${esc(r.name)}</div>
      <div class="sub">${esc(dd.untertitel || r.notiz || "")}</div>
      ${r._disc ? `<div class="discrow"><span class="gstars"><b>★ ${fmt1(g?.rating)}</b> · ${(g?.count || 0).toLocaleString("de-DE")} Bewertungen</span>${inList(r) ? `<span class="onlist">✓ Auf eurer Liste</span>` : canEdit() ? `<button class="addmini" data-add="${esc(r.id)}">＋ Ausprobieren</button>` : ""}</div>`
        : `<div class="rates">${PERS.map(rate).join("")}</div>`}
      <div class="meta">${meta.map(x => `<span>${x}</span>`).join("")}</div>
    </div>
  </article>`;
}

function render() {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === st.tab));
  document.querySelectorAll("#sortseg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.sort === st.sort));
  document.querySelectorAll("[data-chip]").forEach(b => b.setAttribute("aria-pressed", st.chips.has(b.dataset.chip)));
  $("sortseg").hidden = ["ranking", "karte", "entdecken"].includes(st.tab);
  $("fab").hidden = !canEdit(); $("addbtn").hidden = !canEdit();
  const desk = MQ.desk.matches;
  if (desk && st.tab === "karte") st.tab = "neu";
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === st.tab));
  const map = st.tab === "karte", deskMap = desk && st.mapOpen;
  $("mapbtn").setAttribute("aria-pressed", st.mapOpen);
  $("layout").classList.toggle("m", deskMap);
  $("mapview").hidden = !(map || deskMap); $("list").hidden = map; $("sortrow").hidden = false;
  renderChips();
  if (st.tab === "entdecken") { renderDisc(deskMap); return; }
  const list = sorted(filtered(map ? "alle" : st.tab));
  const L = st.tab === "ranking" ? list.filter(r => avg(r) != null) : list;
  $("count").textContent = map ? `${list.length} auf der Karte` : st.tab === "ranking" ? (L.length ? `${L.length} bewertet · nach Ø von euch beiden` : "") : `${L.length} ${L.length === 1 ? "Restaurant" : "Restaurants"}`;
  if (map) { showMap(list); fitMap(); return; }
  if (!L.length) {
    const e = st.tab === "ranking" && !st.q && !st.chips.size
      ? `<b>🏆</b>Noch keine Bewertungen.<br>${canEdit() ? "Restaurant antippen und Sterne vergeben – dann steht hier euer Ranking." : "Oben rechts anmelden, dann könnt ihr direkt hier bewerten."}`
      : `<b>🔍</b>Nichts gefunden. Filter oder Suche anpassen.`;
    $("list").innerHTML = `<div class="empty glass">${e}</div>`;
    if (deskMap) showMap(list); return;
  }
  $("list").innerHTML = L.map((r, i) => card(r, st.tab === "ranking" ? i + 1 : 0)).join("");
  if (deskMap) showMap(L);
  fitMap();
}
/* Karte: Desktop per CSS (volle Fensterhöhe); iPhone/iPad-Kartentab einmalig bis Fensterrand */
function fitMap() {
  const mv = $("mapview"), mw = $("mapwrap");
  if (mv.hidden) return;
  if (MQ.desk.matches) { mw.style.height = ""; }
  else {
    const top = mw.getBoundingClientRect().top + scrollY;
    const want = Math.max(340, Math.round(innerHeight - top - (MQ.wide.matches ? 28 : 112)));
    if (Math.abs((parseFloat(mw.style.height) || 0) - want) > 2) mw.style.height = want + "px";
  }
  const h = Math.round(mw.getBoundingClientRect().height);
  if (MAP && Math.abs(h - LASTH) > 40) {                      // Ausschnitt nach echter Größenänderung neu einpassen
    LASTH = h;
    if (MAPKIND === "leaflet") MAP.invalidateSize();
    if (!FOCUSED) setTimeout(() => overview(false), 80);
  }
}
let fitT = 0, lastW = innerWidth, lastH = innerHeight;
addEventListener("resize", () => {           // nur echte Fensteränderungen, nicht Scrollbalken-Zucken
  if (Math.abs(innerWidth - lastW) < 30 && Math.abs(innerHeight - lastH) < 30) return;
  lastW = innerWidth; lastH = innerHeight; clearTimeout(fitT); fitT = setTimeout(fitMap, 150);
});
let RAF = 0;
function renderAll() { if (RAF) return; RAF = requestAnimationFrame(() => { RAF = 0; renderChips(); render(); refreshSheet(); }); }

/* ---------- Sheet-Grundlagen ---------- */
function placeSheet() {   // Desktop: Details als Spalte im Layout, sonst als Overlay
  const sh = $("sheet"), lay = $("layout");
  if (MQ.desk.matches) { if (sh.parentElement !== lay) lay.insertBefore(sh, $("mapview")); }
  else if (sh.parentElement !== document.body) document.body.insertBefore(sh, $("toast"));
}
let SHEETHTML = "";
function showSheet(html, id, push = true, keepScroll = false) {
  const sc = $("sheetbody"), top = sc.scrollTop, was = st.open;
  if (keepScroll && was === id && html === SHEETHTML) return false;   // nichts geändert → nichts tun
  st.open = id; sc.innerHTML = html; SHEETHTML = html;
  $("scrim").classList.add("on"); $("sheet").classList.add("on"); $("sheet").style.transform = "";
  $("layout").classList.add("d");
  sc.scrollTop = keepScroll ? top : 0;
  if (!MQ.desk.matches) document.body.classList.add("locked");
  if (push && id && !id.startsWith("_")) {
    if (was && !was.startsWith("_") && st.pushed) history.replaceState({ id }, "", "#" + id);
    else { history.pushState({ id }, "", "#" + id); st.pushed = true; }
  }
  if (MAP && MAPKIND === "leaflet") setTimeout(() => MAP.invalidateSize(), 60);
  return true;
}
function closeSheet(pop = true) {
  if (!st.open) return;
  st.open = null; SHEETHTML = ""; $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); $("sheet").style.transform = "";
  document.body.classList.remove("locked"); $("layout").classList.remove("d");
  if (FOCUSED) { FOCUSED = false; setHot(null); setTimeout(() => overview(false), 120); }
  if (MAP && MAPKIND === "leaflet") setTimeout(() => MAP.invalidateSize(), 60);
  if (pop && location.hash) { if (st.pushed) history.back(); else history.replaceState(null, "", location.pathname + location.search); }
  st.pushed = false;
}
function refreshSheet() {   // nach Live-Update offenes Detail neu zeichnen, außer beim Tippen
  const id = st.open; if (!id || id.startsWith("_")) return;
  if ($("sheet").contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (byId(id)) openSheet(id, false, true); else closeSheet();
}

/* ---------- Detail ---------- */
function hoursTable(r, l) {
  const z = zeitenOf(r, l), n = berlinNow(), g = G[r.id];
  if (!z) return `<div class="hint">${esc(l.zeiten_hinweis || "Öffnungszeiten unbekannt.")} <a href="${esc(gmapsUrl(r))}" target="_blank" rel="noopener">Bei Google prüfen ↗</a></div>`;
  return `<table class="hours">${[1, 2, 3, 4, 5, 6, 0].map(d => `<tr class="${d === n.day ? "today" : ""}"><td>${WT[d]}</td><td>${(z[d] || []).length ? z[d].map(s => slot(s).join("–")).join(", ") : "geschlossen"}</td></tr>`).join("")}</table>
    <div class="hint">${g && g.zeiten ? "Live von Google." : esc(l.zeiten_hinweis || "")}</div>`;
}

function rateSection(r) {

/* ---------- Speichern (Firestore) ---------- */
async function patch(id, fields, quiet = false) {
  if (!canEdit()) { toast("Bitte erst anmelden"); return; }
  const r = byId(id); const before = { ...r };
  Object.assign(r, fields); renderAll();            // sofort anzeigen
  try {
    const f = {}; for (const [k, v] of Object.entries(fields)) f[k] = v == null ? FB.fs.deleteField() : (typeof v === "object" ? clean(v) : v);
    f.geaendert = FB.fs.serverTimestamp(); f.von = ME.who || ME.user.email;
    await FB.fs.updateDoc(FB.fs.doc(FB.db, "restaurants", id), f);
    const m = $("savedmark"); if (m) { m.classList.add("on"); setTimeout(() => m.classList.remove("on"), 1200); }
  } catch (err) {
    Object.assign(r, before); for (const k of Object.keys(fields)) if (!(k in before)) delete r[k]; renderAll();
    toast(err.code === "permission-denied" ? "🔒 Dieses Konto darf nicht speichern" : "Speichern fehlgeschlagen – Netz?"); console.error(err);
  }
}

const G_KUECHE = [[/italien|pizz/i, "Italienisch"], [/türk|kebab|döner/i, "Türkisch"], [/griech/i, "Griechisch"], [/vietnam/i, "Vietnamesisch"], [/japan|sushi|ramen/i, "Japanisch"],

  [/korean/i, "Koreanisch"], [/französ/i, "Französisch"], [/spani|tapas/i, "Spanisch"], [/liban|nahöst|orient/i, "Libanesisch"], [/asiat/i, "Asiatisch"],
  [/deutsch|gutbürger|brauhaus|biergarten/i, "Deutsch"], [/café|cafe|kaffee|bäckerei/i, "Café"]];
const PREIS = { PRICE_LEVEL_INEXPENSIVE: "€", INEXPENSIVE: "€", PRICE_LEVEL_MODERATE: "€€", MODERATE: "€€", PRICE_LEVEL_EXPENSIVE: "€€€", EXPENSIVE: "€€€", PRICE_LEVEL_VERY_EXPENSIVE: "€€€€", VERY_EXPENSIVE: "€€€€" };
const kurzAdresse = a => (a || "").replace(/, Deutschland$|, Germany$/, "");

function parseOSMHours(s) {          // OSM opening_hours → {Tag: ["HH:MM-HH:MM"]}, nur gängige Formen
  if (!s) return null;
  if (/^\s*24\/7\s*$/.test(s)) { const z = {}; for (let d = 0; d < 7; d++) z[d] = ["00:00-24:00"]; return z; }
  const DN = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"], z = {};
  for (const part of s.split(";").map(x => x.trim()).filter(Boolean)) {
    if (/^(PH|SH)\b/.test(part)) continue;
    const m = part.match(/^((?:Mo|Tu|We|Th|Fr|Sa|Su)(?:\s*[-,]\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))*)?\s*(.*)$/);
    if (!m) return null;
    const days = [];
    if (!m[1]) days.push(0, 1, 2, 3, 4, 5, 6);
    else for (const seg of m[1].split(",")) {
      const [a, b] = seg.split("-").map(x => DN.indexOf(x.trim()));
      if (b === undefined) days.push(a); else for (let d = a; ; d = (d + 1) % 7) { days.push(d); if (d === b) break; }
    }
    const t = m[2].trim();
    if (/^(off|closed)$/i.test(t)) { days.forEach(d => z[d] = []); continue; }
    const slots = t.split(",").map(x => x.trim().replace(/\+$/, "")).filter(x => /^\d{1,2}:\d{2}-\d{1,2}:\d{2}$/.test(x));
    if (!slots.length) return null;
    days.forEach(d => z[d] = slots.map(x => x.split("-").map(y => y.padStart(5, "0")).join("-")));
  }
  return Object.keys(z).length ? z : null;
}

/* Vorschläge: Google (mit Key) oder OpenStreetMap/Photon (ohne Key) */
const SUG = { token: null, ctl: null };
async function suggest(q) {
  if (CFG.google_maps_api_key && !GFAIL) {
    try {
      await withTimeout(loadGoogleApi(), 5000);
      const { AutocompleteSuggestion, AutocompleteSessionToken } = await google.maps.importLibrary("places");
      SUG.token ||= new AutocompleteSessionToken();
      const { suggestions } = await withTimeout(AutocompleteSuggestion.fetchAutocompleteSuggestions({ input: q, sessionToken: SUG.token, language: "de", region: "de", locationBias: { center: BS, radius: 20000 } }), 5000);
      return suggestions.filter(s => s.placePrediction).slice(0, 6).map(s => ({ src: "google", name: s.placePrediction.mainText?.text || s.placePrediction.text.text, addr: s.placePrediction.secondaryText?.text || "", pred: s.placePrediction }));
    } catch (e) { console.warn("Google-Vorschläge:", e); GFAIL = true; }
  }
  SUG.ctl?.abort(); SUG.ctl = new AbortController();
  const tags = ["restaurant", "cafe", "fast_food", "bar", "pub", "biergarten", "ice_cream"].map(t => "&osm_tag=amenity:" + t).join("");
  const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${BS.lat}&lon=${BS.lng}&limit=8&lang=de${tags}`, { signal: SUG.ctl.signal });
  const j = await res.json();
  return (j.features || []).filter(f => f.properties.name).slice(0, 6).map(f => {
    const p = f.properties;
    return { src: "osm", name: p.name, addr: [[p.street, p.housenumber].filter(Boolean).join(" "), [p.postcode, p.city].filter(Boolean).join(" ")].filter(Boolean).join(", "),
      osm: (p.osm_type || "N")[0].toUpperCase() + p.osm_id, lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] };
  });
}
async function pick(s) {            // → { name, kueche, preis, untertitel, notiz?, details }
  if (s.src === "google") {
    const place = s.pred.toPlace();
    const basis = ["displayName", "formattedAddress", "location", "nationalPhoneNumber", "websiteURI", "regularOpeningHours", "googleMapsURI", "rating", "userRatingCount"];
    try { await place.fetchFields({ fields: [...basis, "primaryTypeDisplayName", "priceLevel", "editorialSummary"] }); }
    catch (e) { await place.fetchFields({ fields: basis }); }
    SUG.token = null;
    const typ = place.primaryTypeDisplayName || "";
    const kueche = (G_KUECHE.find(([re]) => re.test(typ)) || [])[1] || "";
    const adr = kurzAdresse(place.formattedAddress);
    return { name: place.displayName || s.name, kueche, preis: PREIS[place.priceLevel] || "", untertitel: place.editorialSummary || "", quelle: "Google",
      details: { voller_name: place.displayName || s.name, kueche_detail: typ || null, google_query: `${place.displayName} ${adr}`,
        standorte: [{ adresse: adr, lat: place.location?.lat(), lng: place.location?.lng(), telefon: place.nationalPhoneNumber || null,
          zeiten: periodsToZeiten(place.regularOpeningHours?.periods), zeiten_hinweis: place.regularOpeningHours ? "Laut Google." : "Öffnungszeiten bei Google prüfen." }],
        links: { website: place.websiteURI || null, google: place.googleMapsURI || null },
        extern: place.rating ? { wert: place.rating, anzahl: place.userRatingCount, quelle: "Google" } : null } };
  }
  let x = {};
  try { const j = await (await fetch(`https://nominatim.openstreetmap.org/lookup?osm_ids=${s.osm}&format=json&extratags=1&addressdetails=1`, { headers: { "Accept-Language": "de" } })).json(); x = j[0] || {}; } catch (e) {}
  const t = x.extratags || {}, a = x.address || {};
  const cu = (t.cuisine || "").split(";").map(c => CUISINE[c.trim()]).find(Boolean) || "";
  const adr = a.road ? `${a.road}${a.house_number ? " " + a.house_number : ""}, ${a.postcode || ""} ${a.city || a.town || "Braunschweig"}`.replace(/\s+/g, " ").trim() : s.addr;
  const zeiten = parseOSMHours(t.opening_hours);
  const tags = [];
  if (/yes|only/.test(t["diet:vegan"] || "")) tags.push("Vegan-freundlich");
  if (t.outdoor_seating === "yes") tags.push("Terrasse");
  if (t.delivery === "yes") tags.push("Lieferung");
  if (t.takeaway === "yes" || t.takeaway === "only") tags.push("Take-away");
  return { name: s.name, kueche: cu, preis: "", untertitel: "", quelle: "OpenStreetMap",
    details: { voller_name: s.name, kueche_detail: t.cuisine ? t.cuisine.split(";").map(c => CUISINE[c.trim()] || c.trim()).filter((v, i, arr) => arr.indexOf(v) === i).join(" · ") : null,
      google_query: `${s.name} ${adr}`, tags,
      standorte: [{ adresse: adr, lat: +(x.lat || s.lat), lng: +(x.lon || s.lng), telefon: t.phone || t["contact:phone"] || null, zeiten,
        zeiten_hinweis: zeiten ? "Laut OpenStreetMap – ohne Gewähr." : "Öffnungszeiten bei Google prüfen." }],
      links: { website: t.website || t["contact:website"] || null, speisekarte: t["website:menu"] || null, instagram: t["contact:instagram"] || null } } };
}

async function geocode(adresse) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=${encodeURIComponent(adresse.replace("–", "-"))}`, { headers: { "Accept-Language": "de" } });
    const j = await res.json(); return j[0] ? { lat: +j[0].lat, lng: +j[0].lon } : null;
  } catch (e) { return null; }
}

async function initFirebase(seed) {
  const base = `https://www.gstatic.com/firebasejs/${FBV}/`;
  const [app, auth, fs] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const fapp = app.initializeApp(CFG.firebase);
  let db;
  try { db = fs.initializeFirestore(fapp, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch (e) { db = fs.getFirestore(fapp); }
  const authObj = auth.getAuth(fapp);
  FB = { app: fapp, db, fs, auth, authObj };
  auth.getRedirectResult(authObj).catch(() => {});
  // Live-Daten
  fs.onSnapshot(fs.collection(db, "restaurants"), snap => {
    if (snap.empty && !LIVE) { if (ME.user) seedIfEmpty(seed); return; }   // noch nichts in der Datenbank → Startdaten
    LIVE = true;
    D.restaurants = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    document.querySelectorAll(".live").forEach(e => e.removeAttribute("hidden"));
    renderAll();
  }, err => console.warn("Firestore:", err.code));
  auth.onAuthStateChanged(authObj, async u => {
    ME.user = u; ME.ready = false; ME.who = null;
    if (u) {
      ME.who = localStorage.getItem("rs-who");
      try { const p = await fs.getDoc(fs.doc(db, "personen", u.uid)); if (p.exists()) ME.who = p.data().wer; } catch (e) {}
      ME.ready = !!ME.who;
      if (!ME.who) openAccount();
      else if (st.open === "_acct") { closeSheet(); toast(`Hallo ${PERS.find(p => p.k === ME.who).n}! ✨`); }
      if (!LIVE) seedIfEmpty(seed);
    }
    updateAvatar(); renderAll();
  });
}
let seeding = false;
async function seedIfEmpty(seed) {    // einmalig: Startliste in Firestore übernehmen
  if (seeding || !FB || !ME.user) return; seeding = true;
  try {
    const snap = await FB.fs.getDocs(FB.fs.collection(FB.db, "restaurants"));
    if (!snap.empty) return;
    const b = FB.fs.writeBatch(FB.db);
    for (const r of seed) { const { id, ...rest } = r; b.set(FB.fs.doc(FB.db, "restaurants", id), clean({ ...rest, besuche: rest.besuche || [], erstellt: new Date().toISOString() })); }
    await b.commit(); toast("✓ Startliste übernommen");
  } catch (e) { console.warn("Seed:", e.code || e); } finally { seeding = false; }
}

    <button class="go" id="spin">Drehen!</button>
    <button class="go sec2" id="spingo" hidden>Details ansehen</button>
  </div>`, "_dice", false);
  const sync = () => { document.querySelectorAll("#dpool button").forEach(b => b.setAttribute("aria-pressed", b.dataset.pool === dice.pool)); $("dopen").setAttribute("aria-checked", dice.nurOffen); };

  $("dopen").onclick = () => { dice.nurOffen = !dice.nurOffen; sync(); };
  $("spin").onclick = () => {
    const pool = D.restaurants.filter(r => (dice.pool === "alle" || (dice.pool === "fav") === (r.liste === "Favorit")) && (!dice.nurOffen || isOpen(r)));
    if (!pool.length) { $("slotv").innerHTML = `😕<small>Nichts passt – Filter lockern</small>`; return; }
    const w = pool.map(r => 1 + (avg(r) || 2.5) / 2.5);
    const pick = () => { let x = Math.random() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < pool.length; i++) { x -= w[i]; if (x <= 0) return pool[i]; } return pool.at(-1); };
    const v = $("slotv"); v.className = "v spin"; $("spin").disabled = true; $("spingo").hidden = true;
    let n = 0, delay = 50; const final = pick();
    const tick = () => {
      const r = n < 18 ? pool[n % pool.length] : final;
      v.innerHTML = `${emoji(r)} ${esc(r.name)}<small>${esc(det(r).kueche_detail || r.kueche || "")}</small>`;

    };
    tick();
  };
}

let FOCUSED = false, LASTPTS = [], MAPFITTED = false, PINSIG = "";
const gb = pts => { const b = new google.maps.LatLngBounds(); pts.forEach(([a, c]) => b.extend({ lat: a, lng: c })); return b; };
const allVisible = () => { const cur = MAP.getBounds(); return !!cur && LASTPTS.every(([a, c]) => cur.contains({ lat: a, lng: c })); };
let CAM = 0;                                   // jede neue Kamerabewegung bricht die alte ab
function smoothZoom(target, tok = ++CAM, n = 0) {
  if (tok !== CAM || n > 8) return;

  google.maps.event.addListenerOnce(MAP, "idle", () => setTimeout(() => smoothZoom(target, tok, n + 1), 40));
  MAP.setZoom(z + (target > z ? 1 : -1));
}
function stepOut(n, tok) {
  if (tok !== CAM || n > 6 || allVisible()) return;
  google.maps.event.addListenerOnce(MAP, "idle", () => stepOut(n + 1, tok));
  MAP.setZoom(MAP.getZoom() - 1);
}
function fitAll() {
  if (!MAP || !LASTPTS.length) return;
  if (MAPKIND === "google") { const tok = ++CAM; LASTB = gb(LASTPTS); MAP.fitBounds(LASTB, 70); google.maps.event.addListenerOnce(MAP, "idle", () => { if (tok === CAM && MAP.getZoom() > 15) MAP.setZoom(15); }); }
  else MAP.flyToBounds(LASTPTS, { padding: [50, 50], maxZoom: 15, duration: .7 });
}
function overview(force) {     // nur bewegen, wenn nötig – und dann sanft

const pinHtml = r => `<div class="pin" style="--c:${color(r)}"><span>${emoji(r)}</span></div><div class="gtip">${esc(r.name)}${avg(r) != null ? ` · Ø ${fmt1(avg(r))} ★` : ""}</div>`;

let PinOverlay = null;

let MAPINIT = null;
async function showMap(list) {

    if (MQ.wide.matches) m.bindTooltip(esc(r.name) + (avg(r) != null ? ` · Ø ${fmt1(avg(r))} ★` : ""), { direction: "top", offset: [16, -42], className: "maptip" });

  const key = pts.map(p => p.join()).join("|");

  if (pts.length && key !== MAPKEY) { MAPKEY = key; if (!MAPFITTED) { MAPFITTED = true; MAP.fitBounds(pts, { padding: [50, 50], maxZoom: 15 }); } else if (!FOCUSED) overview(false); }
}

/* ---------- Entdecken: bestbewertete Restaurants in Braunschweig (Google) ---------- */
const DISC = { cat: "alle", items: [], loading: false, err: "", key: "", seq: 0 };
const DISC_CATS = [
  ["alle", "✨ Alle", ["beste Restaurants Braunschweig", "Restaurant Braunschweig Innenstadt", "Restaurant Braunschweig"]],
  ["italienisch", "🍕 Italienisch", ["italienisches Restaurant Braunschweig", "Pizzeria Braunschweig"]],
  ["asiatisch", "🥢 Asiatisch", ["asiatisches Restaurant Braunschweig", "Sushi Braunschweig", "vietnamesisches Restaurant Braunschweig"]],
  ["burger", "🍔 Burger", ["Burger Restaurant Braunschweig"]],
  ["steak", "🥩 Steak & Grill", ["Steakhouse Braunschweig", "Grill Restaurant Braunschweig"]],
  ["orient", "🧆 Orientalisch", ["orientalisches Restaurant Braunschweig", "türkisches Restaurant Braunschweig", "griechisches Restaurant Braunschweig"]],
  ["fein", "🥂 Fine Dining", ["gehobenes Restaurant Braunschweig", "Fine Dining Braunschweig"]],
  ["cafe", "☕ Frühstück & Café", ["Frühstück Café Braunschweig", "Brunch Braunschweig"]],
];
const DFIELDS = ["id", "displayName", "formattedAddress", "location", "rating", "userRatingCount", "priceLevel", "primaryTypeDisplayName", "photos", "regularOpeningHours", "nationalPhoneNumber", "websiteURI", "googleMapsURI", "editorialSummary", "businessStatus"];
const DBASE = ["id", "displayName", "formattedAddress", "location", "rating", "userRatingCount", "photos", "regularOpeningHours", "nationalPhoneNumber", "websiteURI", "googleMapsURI", "businessStatus"];
function placeToR(p) {
  const typ = p.primaryTypeDisplayName || "", adr = kurzAdresse(p.formattedAddress), id = "g_" + p.id;
  const kueche = (G_KUECHE.find(([re]) => re.test(typ)) || [])[1] || "";
  const zeiten = periodsToZeiten(p.regularOpeningHours?.periods);
  const g = { url: p.googleMapsURI, web: p.websiteURI, tel: p.nationalPhoneNumber, rating: p.rating, count: p.userRatingCount, status: p.businessStatus, zeiten, reviews: [],
    photos: (p.photos || []).slice(0, 8).map(ph => ({ url: ph.getURI({ maxWidth: 1200, maxHeight: 900 }),
      attr: (ph.authorAttributions || []).map(a => a.uri ? `<a href="${esc(a.uri)}" target="_blank" rel="noopener">${esc(a.displayName)}</a>` : esc(a.displayName)).join(", ") })) };
  const r = { id, _disc: true, name: p.displayName, liste: "Entdecken", kueche, notiz: "", besuche: [],
    details: { voller_name: p.displayName, kueche_detail: typ || null, untertitel: p.editorialSummary || null, preis: PREIS[p.priceLevel] || null, google_query: `${p.displayName} ${adr}`,
      standorte: [{ adresse: adr, lat: p.location?.lat(), lng: p.location?.lng(), telefon: p.nationalPhoneNumber || null, zeiten, zeiten_hinweis: zeiten ? "Laut Google." : null }],
      links: { website: p.websiteURI || null, google: p.googleMapsURI || null },
      extern: p.rating ? { wert: p.rating, anzahl: p.userRatingCount, quelle: "Google" } : null } };
  return { r, g };
}
async function discQuery(text) {
  const ck = "rs-disc:" + text;
  try { const c = JSON.parse(localStorage.getItem(ck) || "null"); if (c && Date.now() - c.t < 864e5) return c.v; } catch (e) {}
  await withTimeout(loadGoogleApi(), 8000);
  const { Place } = await google.maps.importLibrary("places");
  const req = f => Place.searchByText({ textQuery: text, fields: f, language: "de", region: "de", maxResultCount: 20, minRating: 4, locationBias: { center: BS, radius: 12000 } });
  let res; try { res = await withTimeout(req(DFIELDS), 9000); } catch (e) { res = await withTimeout(req(DBASE), 9000); }
  const v = (res.places || []).filter(p => /Braunschweig/.test(p.formattedAddress || "") && (!p.businessStatus || p.businessStatus === "OPERATIONAL") && (p.userRatingCount || 0) >= 30).map(placeToR);
  try { localStorage.setItem(ck, JSON.stringify({ t: Date.now(), v })); } catch (e) {}
  return v;
}
const bayes = g => { const v = g.count || 0, R = g.rating || 0, m = 120, C = 4.2; return (v / (v + m)) * R + (m / (v + m)) * C; };
let discT = 0;
async function loadDisc() {
  const cat = DISC_CATS.find(c => c[0] === DISC.cat) || DISC_CATS[0];
  const q = st.q.trim();
  const queries = q ? [`${q} Braunschweig`] : cat[2];
  const key = queries.join("|");
  if (key === DISC.key && (DISC.items.length || DISC.loading)) return;
  if (!CFG.google_maps_api_key || GFAIL) { DISC.err = "Entdecken braucht Google – gerade nicht erreichbar."; render(); return; }
  DISC.key = key; DISC.loading = true; DISC.err = ""; const my = ++DISC.seq; render();
  try {
    const all = (await Promise.all(queries.map(t => discQuery(t).catch(e => { console.warn("Entdecken:", t, e); return []; })))).flat();
    if (my !== DISC.seq) return;
    const seen = new Set(), items = [];
    for (const { r, g } of all) { if (seen.has(r.id)) continue; seen.add(r.id); G[r.id] = g; GTRIED.add(r.id); r._score = bayes(g); items.push(r); }
    items.sort((a, b) => b._score - a._score);
    DISC.items = items.slice(0, 30);
    if (!DISC.items.length) DISC.err = "Nichts gefunden.";
  } catch (e) { console.warn(e); DISC.err = "Konnte gerade nichts laden."; }
  DISC.loading = false; if (st.tab === "entdecken") render();
}
function renderDisc(deskMap) {
  if (!DISC.key && !DISC.loading && !DISC.err) { loadDisc(); }
  const list = DISC.items;
  $("count").innerHTML = DISC.loading ? "Suche die besten Adressen …" : list.length ? `${list.length} Top-Adressen · Google-Bewertung, gewichtet nach Anzahl` : "";
  if (DISC.loading && !list.length) { $("list").innerHTML = Array.from({ length: 6 }, () => `<div class="skel"></div>`).join(""); return; }
  if (!list.length) { $("list").innerHTML = `<div class="empty glass"><b>🧭</b>${esc(DISC.err || "Nichts gefunden.")}</div>`; return; }
  $("list").innerHTML = list.map((r, i) => card(r, i + 1)).join("");
  if (deskMap) showMap(list);
  fitMap();
}
async function addFromDisc(id, liste = "Ausprobieren", openAfter = false) {
  const r = byId(id); if (!r || !canEdit()) { if (!canEdit()) toast("Bitte erst anmelden"); return; }
  try {
    const ref = await FB.fs.addDoc(FB.fs.collection(FB.db, "restaurants"),

/* ---------- Google Places (optional, mit API-Key) ---------- */
let GLOAD = null, GFAIL = false; const GTRIED = new Set();
window.gm_authFailure = () => { GFAIL = true; console.warn("Google-Key abgelehnt – nutze OpenStreetMap"); const i = $("pinfo"); if (i) i.textContent = "Vorschläge von OpenStreetMap – antippen füllt alles aus."; };
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
function loadGoogleApi() {
  return GLOAD ||= new Promise((ok, err) => {
    window.__gmok = ok;
    const s = document.createElement("script");
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(CFG.google_maps_api_key)}&v=weekly&language=de&region=DE&loading=async&callback=__gmok`;
    s.onerror = err; document.head.append(s);
  });
}
function periodsToZeiten(periods) {
  if (!periods || !periods.length) return null;
  const z = {}, p2 = n => String(n).padStart(2, "0");
  for (const p of periods) {
    if (!p.open) continue;
    if (!p.close) { for (let d = 0; d < 7; d++) z[d] = ["00:00-24:00"]; return z; }
    (z[p.open.day] ||= []).push(`${p2(p.open.hour)}:${p2(p.open.minute)}-${p2(p.close.hour)}:${p2(p.close.minute)}`);
  }
  return z;
}
async function searchPlace(query, fields, near) {
  await loadGoogleApi();
  const { Place } = await google.maps.importLibrary("places");
  const { places } = await Place.searchByText({ textQuery: query, fields, language: "de", region: "de", maxResultCount: 1, ...(near ? { locationBias: near } : { locationBias: { lat: 52.2689, lng: 10.5268 } }) });
  return places && places[0];
}
async function placeDetails(query) {   // für neue Restaurants
  try {
    const p = await searchPlace(query, ["formattedAddress", "location", "nationalPhoneNumber", "websiteURI", "regularOpeningHours"]);
    if (!p) return null;
    return { web: p.websiteURI, standort: { adresse: p.formattedAddress?.replace(/, Deutschland$/, ""), lat: p.location?.lat(), lng: p.location?.lng(), telefon: p.nationalPhoneNumber, zeiten: periodsToZeiten(p.regularOpeningHours?.periods) } };
  } catch (e) { console.warn(e); return null; }
}
async function loadGoogle(list) {
  if (!CFG.google_maps_api_key || GFAIL) return;
  let cache = {}; try { cache = JSON.parse(sessionStorage.getItem("rs-g") || "{}"); } catch (e) {}
  const need = list.filter(r => !G[r.id] && !(G[r.id] = cache[r.id]) && !GTRIED.has(r.id));
  need.forEach(r => GTRIED.add(r.id));
  if (!need.length) return;
  try { await withTimeout(loadGoogleApi(), 8000); } catch (e) { GFAIL = true; console.warn("Google Maps API nicht ladbar", e); return; }
  await Promise.all(need.map(async r => {
    const l = locs(r)[0];
    try {
      const p = await searchPlace(det(r).google_query || `${r.name} Restaurant Braunschweig`,
        ["id", "displayName", "photos", "rating", "userRatingCount", "regularOpeningHours", "googleMapsURI", "websiteURI", "nationalPhoneNumber", "businessStatus", "reviews"],
        l && l.lat ? { lat: l.lat, lng: l.lng } : null);
      if (!p) return;
      G[r.id] = cache[r.id] = {
        url: p.googleMapsURI, web: p.websiteURI, tel: p.nationalPhoneNumber, rating: p.rating, count: p.userRatingCount, status: p.businessStatus,
        zeiten: periodsToZeiten(p.regularOpeningHours?.periods),
        photos: (p.photos || []).slice(0, 8).map(ph => ({ url: ph.getURI({ maxWidth: 1200, maxHeight: 900 }),
          attr: (ph.authorAttributions || []).map(a => a.uri ? `<a href="${esc(a.uri)}" target="_blank" rel="noopener">${esc(a.displayName)}</a>` : esc(a.displayName)).join(", ") })),
        reviews: (p.reviews || []).filter(v => v.text).map(v => ({ rating: v.rating, text: v.text.length > 320 ? v.text.slice(0, 317) + "…" : v.text, when: v.relativePublishTimeDescription,
          author: v.authorAttribution?.displayName || "Gast", uri: v.authorAttribution?.uri, photo: v.authorAttribution?.photoURI })),
      };
    } catch (e) { console.warn("Places:", r.name, e); }
  }));
  try { sessionStorage.setItem("rs-g", JSON.stringify(cache)); } catch (e) {}
}

/* ---------- Standort ---------- */

    st.pos = { lat: p.coords.latitude, lng: p.coords.longitude };

    if (st.tab !== "ranking") st.sort = "dist";

  }, () => { $("locbtn").textContent = "📍"; toast("Standort nicht freigegeben"); }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
}

/* ---------- Events ---------- */

  if (e.target.closest("#sheet")) return;

});

const onResize = () => { placeSheet(); render(); setTimeout(() => { if (MAP) { if (MAPKIND === "leaflet") MAP.invalidateSize(); MAPKEY = ""; if (!$("mapview").hidden) render(); } }, 120); };
MQ.desk.addEventListener("change", onResize); MQ.wide.addEventListener("change", onResize);
addEventListener("popstate", () => { const id = location.hash.slice(1); if (id && byId(id)) openSheet(id, false); else closeSheet(false); });
const ctl = $("controls"); new IntersectionObserver(([e]) => ctl.classList.toggle("stuck", e.intersectionRatio < 1), { threshold: [1], rootMargin: "-1px 0px 0px 0px" }).observe(ctl);
setInterval(() => { if (!st.open) render(); }, 60000);
