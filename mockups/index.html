<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockups Highlights</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f6f3ee; --surface: #fffdf9; --line: #e7e1d7; --text: #1f1d1a; --muted: #6f6a62;
  --accent: #d6411f; --accent-soft: #fbe5dd; --ok: #2f7a4b; --ok-soft: #dff0e5;
  --warn: #9a6400; --warn-soft: #fbefd5; --chip: #ece7de;
  --lidl: #1d5fa8; --rewe: #c8102e; --edeka: #f0b400; --pic: #ffffff;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161513; --surface: #201e1b; --line: #33302b; --text: #f1ede6; --muted: #a39d93;
    --accent: #ff7a55; --accent-soft: #3a231b; --ok: #6cc690; --ok-soft: #1c3226;
    --warn: #f0b64a; --warn-soft: #3a2e15; --chip: #2a2824;
    --lidl: #6aa5ea; --rewe: #ff6b7f; --edeka: #ffd24d; --pic: #f4f1ec;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body { overflow-x: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
header { padding: calc(20px + env(safe-area-inset-top)) 0 8px; }
h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
h1 span { color: var(--accent); }
.meta { color: var(--muted); font-size: 14px; margin-top: 6px; }

.controls {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: 10px 0 8px; border-bottom: 1px solid var(--line);
}
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tab {
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 10px; padding: 8px 4px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
}
.tab small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.tab[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.tab[aria-pressed="true"] small { color: inherit; opacity: .7; }
.row { display: flex; gap: 8px; margin-top: 8px; }
.search {
  flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 16px;
}
select {
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 10px; padding: 9px 8px; font: inherit; font-size: 14px;
}
.chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 0; background: var(--chip); color: var(--text); border-radius: 999px;
  padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); color: #fff; }

h2 {
  font-size: 15px; text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 8px;
  display: flex; align-items: center; gap: 8px;
}
h2 .dot { width: 10px; height: 10px; border-radius: 50%; }
h2 .addr { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: 13px; }

.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.card > div { min-width: 0; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px; display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 12px; align-items: start;
  min-width: 0;
}
.pic {
  position: relative; width: 76px; height: 76px; border-radius: 12px; background: var(--pic);
  display: grid; place-items: center; padding: 0; border: 0; cursor: zoom-in; overflow: visible;
}
.pic img {
  position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box;
  object-fit: contain; border-radius: 12px; padding: 4px;
}
.pic.leer { cursor: default; font-size: 32px; }
.pic .emo {
  position: absolute; right: -6px; bottom: -6px; font-size: 15px; line-height: 1;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px;
}
.pic.leer .emo { display: none; }
.lightbox {
  position: fixed; inset: 0; z-index: 20; background: rgba(10, 9, 8, .82); display: none;
  align-items: center; justify-content: center; padding: 24px 16px; cursor: zoom-out;
}
.lightbox.open { display: flex; }
.lightbox figure { margin: 0; max-width: 520px; width: 100%; text-align: center; }
.lightbox img { max-width: 100%; max-height: 75vh; border-radius: 12px; background: #fff; }
.lightbox figcaption { color: #f1ede6; font-size: 13px; margin-top: 10px; }
.name { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; word-break: break-word; -webkit-hyphens: auto; hyphens: auto; }
.info { color: var(--muted); font-size: 13px; margin-top: 3px; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag { font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 6px; }
.tag.tage { background: var(--warn-soft); color: var(--warn); }
.tag.m-lidl { color: var(--lidl); background: color-mix(in srgb, var(--lidl) 14%, transparent); }
.tag.m-rewe { color: var(--rewe); background: color-mix(in srgb, var(--rewe) 14%, transparent); }
.tag.m-edeka { color: var(--text); background: color-mix(in srgb, var(--edeka) 35%, transparent); }
.price { text-align: right; white-space: nowrap; }
.now { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.app { font-size: 11px; font-weight: 700; color: var(--ok); background: var(--ok-soft); border-radius: 6px; padding: 1px 5px; vertical-align: 3px; }
.was { color: var(--muted); font-size: 13px; white-space: normal; }
.was s { white-space: nowrap; }
.was s { margin-right: 4px; }
.aktion { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; }
.save { color: var(--accent); font-weight: 700; }
.unit { color: var(--muted); font-size: 12px; margin-top: 2px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

details { margin: 28px 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
summary { cursor: pointer; font-weight: 600; }
details p { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 8px 0 28px; }
</style>
<style>
.mock { background: var(--text); color: var(--bg); font-size: 13px; padding: 8px 16px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mock b { margin-right: 4px; }
.mock a { color: inherit; text-decoration: none; border: 1px solid currentColor; border-radius: 999px; padding: 3px 10px; opacity: .65; }
.mock a.on { opacity: 1; background: var(--bg); color: var(--text); border-color: var(--bg); font-weight: 700; }
.mock .desc { width: 100%; opacity: .8; font-size: 12px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--chip); border-radius: 12px; padding: 3px; margin-bottom: 8px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; padding: 7px 4px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.seg small { font-weight: 400; color: var(--muted); }
.seg.mini { margin: 0; flex: none; display: inline-grid; padding: 2px; border-radius: 999px; }
.seg.mini button { border-radius: 999px; }
.seg.mini button { padding: 4px 11px; font-size: 13px; white-space: nowrap; }
.card.normal { grid-template-columns: 52px minmax(0, 1fr) auto; padding: 8px 10px; gap: 10px; border-color: transparent; background: color-mix(in srgb, var(--surface) 70%, var(--bg)); }
.card.normal .pic { width: 52px; height: 52px; border-radius: 10px; }
.card.normal .pic img { border-radius: 10px; padding: 3px; }
.card.normal .name { font-weight: 500; font-size: 15px; }
.card.normal .info { font-size: 12px; }
.card.normal .now { font-size: 16px; font-weight: 600; }
.card.normal .emo { display: none; }
.star { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; margin-right: 4px; vertical-align: 2px; }
.more { width: 100%; margin-top: 8px; border: 1px dashed var(--line); background: transparent; color: var(--text); border-radius: var(--radius); padding: 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.more small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.subhead { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 6px; }
.bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
.bnav button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; padding: 4px; cursor: pointer; }
.bnav button span { display: block; font-size: 22px; line-height: 1.2; filter: grayscale(1); opacity: .7; }
.bnav button[aria-pressed="true"] { color: var(--accent); }
.bnav button[aria-pressed="true"] span { filter: none; opacity: 1; }
body.v3 { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
.hint { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<div class="mock" id="mock"></div>
<div class="wrap">
  <header>
    <h1>Wochen<span>angebote</span></h1>
    <div class="meta" id="meta">Lade Angebote …</div>
  </header>
  <div class="controls">
    <div id="segtop"></div>
    <div class="tabs" id="tabs"></div>
    <div class="row">
      <input class="search" id="q" type="search" placeholder="Suchen, z. B. Skyr" autocomplete="off">
      <div id="segrow"></div>
      <select id="sort" aria-label="Sortierung">
        <option value="kat">Kategorie</option>
        <option value="preis">Preis ↑</option>
        <option value="rabatt">Rabatt ↓</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <main id="out"></main>
  <footer id="foot"></footer>
  <div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Bild">
    <figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure>
  </div>
</div>
<nav class="bnav" id="bnav" hidden></nav>
<script>
const VARIANTS = {
  1: ["Umschalter", "Oben ein Schalter Highlights | Alle. Läden, Filter und Suche beziehen sich auf den gewählten Modus."],
  2: ["Aufklappen", "Highlights pro Laden, darunter ein Button, der die übrigen Angebote kompakt aufklappt."],
  3: ["Leiste unten", "App-Leiste unten: Highlights, Alle, Suche. Die Suche durchsucht immer alles."],
  4: ["Mischform", "Highlights als Start, kleiner Schalter vorne in der Filterleiste, die Suche findet immer alles (Highlights mit ⭐ zuerst)."],
};
const V = Math.max(1, Math.min(4, +(new URLSearchParams(location.search).get("v") || 1)));
document.body.classList.add("v" + V);
const $ = s => document.querySelector(s);
const eur = n => n == null ? "" : n.toFixed(2).replace(".", ",") + " €";
const fmtDate = iso => { const [y, m, d] = iso.split("-"); return `${d}.${m}.`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const brk = s => esc(s).replace(/\//g, "/<wbr>");

const state = { markt: "alle", kat: null, q: "", sort: "kat", rabatt: false, modus: "hl", offen: {} };
let DATA, HL = [], NORM = [];

$("#mock").innerHTML = `<b>Mockup</b>` + [1, 2, 3, 4].map(i => `<a href="?v=${i}" class="${i === V ? "on" : ""}">${i} ${VARIANTS[i][0]}</a>`).join("")
  + `<div class="desc">${VARIANTS[V][1]} Normale EDEKA-Angebote fehlen im Mockup noch.</div>`;

async function init() {
  const [d, n] = await Promise.all([fetch("../angebote.json", { cache: "no-cache" }).then(r => r.json()), fetch("normal.json", { cache: "no-cache" }).then(r => r.json())]);
  DATA = d;
  HL = DATA.maerkte.flatMap(m => m.angebote.map(a => ({ ...a, markt: m.id, hl: true, bild: a.bild && "../" + a.bild, prospekt: a.prospekt && "../" + a.prospekt })));
  NORM = n.map(a => ({ ...a, hl: false }));
  $("#meta").textContent = `KW ${DATA.kw} · ${fmtDate(DATA.von)}–${fmtDate(DATA.bis)} · ${HL.length} Highlights · ${HL.length + NORM.length} Angebote`;
  $("#foot").textContent = "Mockup mit echten Daten der KW " + DATA.kw;
  $("#q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
  $("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
  if (V === 3) {
    $("#bnav").hidden = false;
    $("#q").closest(".row").style.display = "none";
  }
  render();
}

// Welche Angebote kommen überhaupt in Frage?
function pool(ignoreKat) {
  let base;
  const suche = !!state.q;
  if (V === 1) base = state.modus === "hl" ? HL : [...HL, ...NORM];
  else if (V === 2) base = [...HL, ...NORM];
  else if (V === 3) base = state.modus === "hl" ? HL : [...HL, ...NORM];
  else base = (state.modus === "hl" && !suche) ? HL : [...HL, ...NORM];
  return base.filter(a =>
    (state.markt === "alle" || a.markt === state.markt) &&
    (ignoreKat || !state.kat || a.kategorie === state.kat) &&
    (!state.rabatt || a.ersparnis || a.aktion) &&
    (!state.q || `${a.produkt} ${a.info} ${a.kategorie}`.toLowerCase().includes(state.q)));
}

function seg(mini) {
  const nH = HL.length, nA = HL.length + NORM.length;
  return `<div class="seg${mini ? " mini" : ""}">
    <button data-mode="hl" aria-pressed="${state.modus === "hl"}">⭐ Highlights${mini ? "" : ` <small>${nH}</small>`}</button>
    <button data-mode="alle" aria-pressed="${state.modus === "alle"}">Alle${mini ? "" : ` <small>${nA}</small>`}</button></div>`;
}

function renderControls() {
  $("#segtop").innerHTML = V === 1 ? seg(false) : "";
  $("#segrow").innerHTML = "";
  if (V === 3) {
    const t = [["hl", "⭐", "Highlights"], ["alle", "🛒", "Alle"], ["suche", "🔍", "Suche"]];
    $("#bnav").innerHTML = t.map(([m, i, l]) => `<button data-nav="${m}" aria-pressed="${state.modus === m || (m === "suche" && state.suche)}"><span>${i}</span>${l}</button>`).join("");
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { state.modus = b.dataset.mode; state.kat = null; render(); });
  document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => {
    const m = b.dataset.nav;
    if (m === "suche") {
      state.suche = true; state.modus = "alle";
      $("#q").closest(".row").style.display = "";
      $("#q").focus();
    } else {
      state.suche = false; state.modus = m; state.q = ""; $("#q").value = "";
      $("#q").closest(".row").style.display = "none";
    }
    state.kat = null; render(); window.scrollTo(0, 0);
  });

  const tabs = [{ id: "alle", name: "Alle Läden" }, ...DATA.maerkte.map(m => ({ id: m.id, name: m.id.toUpperCase() }))];
  const merk = state.markt;
  $("#tabs").innerHTML = tabs.map(t => {
    state.markt = t.id; const n = (V === 2 ? pool().filter(a => a.hl) : pool()).length; state.markt = merk;
    return `<button class="tab" data-m="${t.id}" aria-pressed="${state.markt === t.id}">${t.id === "alle" ? (V === 2 || state.modus === "hl" ? "Highlights" : "Alle") : t.name}<small>${n}</small></button>`;
  }).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { state.markt = b.dataset.m; render(); });

  const p = pool(true);
  const kats = [...new Map(p.map(a => [a.kategorie, a.emoji])).entries()];
  const red = p.filter(a => a.ersparnis || a.aktion).length;
  $("#chips").innerHTML = (V === 4 ? seg(true) : "") +
    `<button class="chip" data-k="" aria-pressed="${!state.kat && !state.rabatt}">Alles</button>` +
    `<button class="chip" data-r="1" aria-pressed="${state.rabatt}">🔻 Mit Rabatt/Aktion (${red})</button>` +
    kats.map(([k, e]) => `<button class="chip" data-k="${esc(k)}" aria-pressed="${state.kat === k}">${e} ${esc(k)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    if (b.dataset.r) state.rabatt = !state.rabatt;
    else if (!b.dataset.k) { state.kat = null; state.rabatt = false; }
    else state.kat = state.kat === b.dataset.k ? null : b.dataset.k;
    render();
  });
}

function card(a, showMarkt, markStar) {
  const tags = [];
  if (showMarkt) tags.push(`<span class="tag m-${a.markt}">${a.markt.toUpperCase()}</span>`);
  if (a.tage) tags.push(`<span class="tag tage">${esc(a.tage)}</span>`);
  const was = a.normal
    ? `<div class="was"><s>${eur(a.normal)}</s>${a.ersparnis ? `<span class="save">−${a.ersparnis}%</span>` : ""}</div>`
    : a.ersparnis ? `<div class="was"><span class="save">−${a.ersparnis}%</span></div>`
    : a.aktion ? `<div class="was"><span class="aktion">Aktion</span></div>` : "";
  const star = markStar && a.hl ? `<span class="star">⭐ Highlight</span>` : "";
  return `<article class="card${a.hl ? "" : " normal"}">
    ${a.bild
      ? `<button class="pic" data-p="${esc(a.prospekt || a.bild)}" data-t="${esc(a.markt.toUpperCase() + " · " + a.produkt)}">
           <img src="${esc(a.bild)}" alt="" loading="lazy" decoding="async"><span class="emo">${a.emoji}</span></button>`
      : `<div class="pic leer">${a.emoji}</div>`}
    <div>
      <div class="name">${star}${brk(a.produkt)}</div>
      ${a.info ? `<div class="info">${brk(a.info)}</div>` : ""}
      ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
    </div>
    <div class="price">
      <div class="now">${a.app ? '<span class="app">App</span> ' : ""}${eur(a.preis)}</div>
      ${was}
      ${a.grundpreis ? `<div class="unit">${esc(a.grundpreis.replace(".", ","))}</div>` : ""}
    </div>
  </article>`;
}

function render() {
  renderControls();
  let list = pool();
  const mischung = list.some(a => a.hl) && list.some(a => !a.hl);
  // Highlights immer zuerst
  list = [...list].sort((x, y) => (y.hl - x.hl));
  if (!list.length) { $("#out").innerHTML = `<div class="empty">Keine Treffer.</div>`; return; }

  if (state.sort !== "kat") {
    const key = state.sort === "preis" ? (a => a.preis ?? 1e9) : (a => -(a.ersparnis ?? -1));
    list.sort((x, y) => key(x) - key(y));
    $("#out").innerHTML = `<div class="list" style="margin-top:14px">${list.map(a => card(a, true, mischung)).join("")}</div>`;
    return;
  }
  $("#out").innerHTML = DATA.maerkte.map(m => {
    const items = list.filter(a => a.markt === m.id);
    if (!items.length) return "";
    const h = items.filter(a => a.hl), n = items.filter(a => !a.hl);
    let body;
    if (V === 2 && !state.q) {
      const offen = state.offen[m.id];
      body = `<div class="list">${h.map(a => card(a, false, false)).join("")}</div>`
        + (n.length ? (offen
          ? `<div class="subhead">Weitere Angebote</div><div class="list">${n.map(a => card(a, false, false)).join("")}</div>
             <button class="more" data-open="${m.id}">Weitere ${m.id.toUpperCase()}-Angebote zuklappen</button>`
          : `<button class="more" data-open="${m.id}">+ ${n.length} weitere ${m.id.toUpperCase()}-Angebote anzeigen<small>ohne Watchlist-Treffer</small></button>`) : "");
    } else if (mischung) {
      body = (h.length ? `<div class="list">${h.map(a => card(a, false, true)).join("")}</div>` : "")
        + (n.length ? `<div class="subhead">Weitere Angebote</div><div class="list">${n.map(a => card(a, false, false)).join("")}</div>` : "");
    } else {
      body = `<div class="list">${items.map(a => card(a, false, false)).join("")}</div>`;
    }
    return `<h2><span class="dot" style="background:var(--${m.id})"></span>${esc(m.name)} <span class="addr">${esc(m.adresse)}</span></h2>${body}`;
  }).join("") + (V === 4 && state.modus === "hl" && state.q ? `<p class="hint">Die Suche zeigt auch Angebote außerhalb der Highlights.</p>` : "");
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { state.offen[b.dataset.open] = !state.offen[b.dataset.open]; render(); });
}

document.addEventListener("click", e => {
  const b = e.target.closest(".pic[data-p]");
  if (b) { $("#lbimg").src = b.dataset.p; $("#lbcap").textContent = b.dataset.t; $("#lb").classList.add("open"); }
  else if (e.target.closest("#lb")) $("#lb").classList.remove("open");
});
init();
</script>
</body>
</html>
